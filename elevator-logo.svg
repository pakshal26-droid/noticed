<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="400" height="464" role="img" aria-label="Elevator doors logo">
  <title>Elevator doors mark</title>

  <defs>
    <!-- warm light spilling from the lower half of the doorway -->
    <linearGradient id="doorLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="52%"  stop-color="#FEFCF6"/>
      <stop offset="66%"  stop-color="#FBE6BE"/>
      <stop offset="100%" stop-color="#F4D69B"/>
    </linearGradient>
  </defs>

  <g id="mark">

    <!-- call arrow -->
    <path d="M50 0 L59.5 10 H40.5 Z" fill="#37352F" stroke="#37352F" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- door frame -->
    <rect x="0" y="16" width="100" height="100" fill="#37352F"/>

    <!-- inner outline -->
    <rect x="7" y="23" width="86" height="86" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>

    <!-- doorway light, spilling past the frame at the top -->
    <rect x="29" y="16" width="41" height="93.7" fill="url(#doorLight)"/>

    <!-- gap between the two doors -->
    <rect x="49.6" y="16" width="0.8" height="93.7" fill="#37352F"/>

    <!-- call button -->
    <rect x="72" y="64.4" width="15" height="2.2" rx="1.1" fill="#FFFFFF"/>

  </g>
</svg>
