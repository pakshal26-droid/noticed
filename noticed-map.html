<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticed — Network map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ============================= CSS ============================= -->
<style>
/* ---- page shell (delete when pasting into your site) ---- */
body{margin:0;background:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}

/* ================= NETWORK MAP SECTION ================= */
.nmap{
  --ink:#0B0F19;
  --muted:#646E7E;
  --line:#E7EAF0;
  --blue:#2563EB;
  --blue-dark:#1D4ED8;
  --land:#EFF2F7;        /* no screens yet */
  --land-hover:#E2E7F0;
  --live:#CBDDFF;        /* has at least one live screen */
  --live-hover:#93B8FF;
  --soon:#E3EAF6;        /* launching next */
  --soon-hover:#D3DEEF;
  --soon-line:#B9C6DC;
  --edge:#FFFFFF;
  --bg:#FBFCFE;
  background:var(--bg);
  color:var(--ink);
  padding:96px 24px 104px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.nmap *{box-sizing:border-box}
.nmap__inner{max-width:1180px;margin:0 auto}

/* ---- heading ---- */
.nmap__eyebrow{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--blue);margin:0 0 18px;
}
.nmap__eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
.nmap__title{
  margin:0 auto 14px;max-width:660px;text-align:center;
  font-size:clamp(28px,3.6vw,44px);line-height:1.16;font-weight:600;letter-spacing:-.02em;
}
.nmap__title span{color:var(--blue)}
.nmap__sub{
  margin:0 auto;max-width:600px;text-align:center;
  font-size:15px;line-height:1.65;color:var(--muted);
}

/* ---- layout ---- */
.nmap__grid{
  display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:56px;align-items:start;
  margin-top:56px;
}

/* ---- map stage ---- */
.nmap__stage{position:relative;isolation:isolate}
.nmap__svg{display:block;width:100%;height:auto;max-height:min(80vh,840px);overflow:visible}
.nmap__zoom{transition:transform .9s cubic-bezier(.22,.61,.36,1)}
.nmap.is-reduced .nmap__zoom,
.nmap.is-reduced .pin-inner,
.nmap.is-reduced .lblwrap text{transition:none}

/* wards */
.ward{
  fill:var(--land);stroke:var(--edge);stroke-width:.9;
  transition:fill .25s ease;
}
.ward.live{fill:var(--live);cursor:pointer}
.ward.soon{fill:var(--soon);stroke:var(--soon-line);stroke-width:1.1;stroke-dasharray:4 3}
.ward:hover{fill:var(--land-hover)}
.ward.live:hover{fill:var(--live-hover)}
.ward.soon:hover{fill:var(--soon-hover)}

/* ward labels */
.lblwrap{pointer-events:none}
.lblwrap text{
  font-family:inherit;font-size:14px;font-weight:500;fill:#8A94A6;
  transition:opacity .4s ease,fill .25s ease;
}
.lblwrap.live text{fill:#1E3A6E;font-weight:600}
.lblwrap.soon text{fill:#66738A;font-weight:600}
.nmap[data-view="zoom"] .lblwrap:not(.live) text{opacity:0}

/* pins */
.pins{opacity:0;pointer-events:none;transition:opacity .45s ease .25s}
.nmap[data-view="zoom"] .pins{opacity:1;pointer-events:auto}
.pin{cursor:pointer}
.pin-inner{transition:transform .9s cubic-bezier(.22,.61,.36,1)}
.pin-art{
  transform-box:fill-box;transform-origin:50% 100%;
  opacity:0;transform:translateY(-14px) scale(.6);
}
.nmap.is-in .pin-art{
  opacity:1;transform:none;
  transition:transform .55s cubic-bezier(.34,1.4,.64,1),opacity .35s ease;
}
.pin-body{fill:var(--blue);stroke:#fff;stroke-width:1.4}
.pin-dot{fill:#fff}
.pin-ring{fill:none;stroke:var(--blue);stroke-width:1.6;opacity:0}
.nmap.is-in .pin.is-on .pin-art{transform:scale(1.28) translateY(-2px)}
.nmap .pin.is-on .pin-body{fill:var(--blue-dark)}
.nmap .pin.is-on .pin-ring{animation:nmapPing 1.5s cubic-bezier(0,.4,.6,1) infinite}
@keyframes nmapPing{
  0%{r:6;opacity:.55;stroke-width:2}
  100%{r:20;opacity:0;stroke-width:.4}
}

/* cluster badge (overview only) */
.cluster{transition:opacity .35s ease;cursor:pointer}
.nmap[data-view="zoom"] .cluster{opacity:0;pointer-events:none}
.cluster-halo{fill:var(--blue);opacity:.14;animation:nmapHalo 2.6s ease-out infinite}
@keyframes nmapHalo{0%{r:16;opacity:.28}70%{r:48;opacity:0}100%{r:48;opacity:0}}
.cluster-core{fill:var(--blue);stroke:#fff;stroke-width:2}
.cluster-txt{fill:#fff;font-size:13px;font-weight:700;font-family:inherit;text-anchor:middle}
.cluster-hint{fill:#2B3A55;font-size:14px;font-weight:600;font-family:inherit}

/* tooltip */
.nmap__tip{
  position:absolute;z-index:5;pointer-events:none;left:0;top:0;
  padding:9px 13px;border-radius:10px;background:#111827;color:#fff;
  font-size:12.5px;line-height:1.45;font-weight:500;white-space:nowrap;
  box-shadow:0 10px 28px rgba(11,15,25,.22);
  opacity:0;transform:translate(-50%,-120%) scale(.96);
  transition:opacity .16s ease,transform .16s ease;
}
.nmap__tip.is-on{opacity:1;transform:translate(-50%,-135%) scale(1)}
.nmap__tip b{display:block;font-weight:600}
.nmap__tip span{color:#9CA9BD;font-size:11.5px}

/* view toggle */
.nmap__views{position:absolute;top:0;left:0;display:flex;gap:6px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 14px rgba(11,15,25,.05)}
.nmap__views button{
  border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:500;color:var(--muted);
  padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s;
}
.nmap__views button:hover{color:var(--ink)}
.nmap__views button[aria-pressed="true"]{background:var(--blue);color:#fff}
.nmap__views button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- side panel ---- */
.nmap__panel{display:flex;flex-direction:column;gap:18px;position:sticky;top:32px}
.nmap__card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}

.nmap__stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.nmap__stat{padding:24px 20px;border-right:1px solid var(--line)}
.nmap__stat:last-child{border-right:0}
.nmap__stat b{display:block;font-size:34px;line-height:1;font-weight:700;letter-spacing:-.03em;color:var(--blue)}
.nmap__stat span{display:block;margin-top:10px;font-size:12px;line-height:1.5;color:var(--muted)}

.nmap__listhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:10px;flex-wrap:wrap}
.nmap__listhead h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.nmap__listhead em{font-style:normal;font-size:12px;color:var(--muted)}
.nmap__list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
.nmap__list button{
  width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;
  background:transparent;border:0;font:inherit;cursor:pointer;padding:11px 10px;border-radius:10px;
  transition:background .2s ease;
}
.nmap__list button:hover,.nmap__list button.is-on{background:#F2F6FF}
.nmap__list button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.nmap__idx{width:22px;flex:0 0 22px;font-size:11px;font-weight:600;color:#AAB3C2;padding-top:2px}
.nmap__place{font-size:14px;font-weight:500;color:var(--ink)}
.nmap__meta{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.nmap__legend{display:flex;flex-wrap:wrap;gap:18px;padding-left:2px}
.nmap__legend span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.nmap__sw{width:11px;height:11px;border-radius:3px;background:var(--live)}
.nmap__sw.soon{background:var(--soon);border:1px dashed var(--soon-line)}
.nmap__sw.off{background:var(--land)}
.nmap__sw.pin{border-radius:50%;background:var(--blue)}

/* ---- responsive ---- */
@media (max-width:1080px){
  .nmap__grid{grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:36px}
  .nmap__stats{grid-template-columns:repeat(2,1fr)}
  .nmap__stat:nth-child(2){border-right:0}
  .nmap__stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:860px){
  .nmap{padding:72px 18px 80px}
  .nmap__grid{grid-template-columns:1fr;gap:32px;margin-top:40px}
  .nmap__panel{position:static}
  .nmap__stage{display:flex;flex-direction:column;align-items:center}
  .nmap__svg{max-height:64vh}
  .nmap__views{position:static;margin:0 0 18px}
  .nmap__list{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .nmap *{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>

<!-- ============================= JS ============================= -->
<script>
(function () {

  /* ===========================================================
     ==============  EVERYTHING YOU EDIT IS HERE  ==============
     ===========================================================

     To add a screen, add one line to LOCATIONS. That is the only
     change needed. The pin, the list row, the counts, the headline
     sentence, the cluster badge and the highlighted areas on the
     map all rebuild themselves from this array.

       lat / lng : copied straight out of Google Maps
       name      : building name
       type      : shown under the name in the list
       screens   : how many screens in that building (optional, default 1)
     =========================================================== */

  var LOCATIONS = [
    { name: 'Earth View',       type: 'Residential building', screens: 1, lat: 18.960451, lng: 72.821459 },
    { name: 'Rajendra Vihar',   type: 'Residential building', screens: 1, lat: 18.959961, lng: 72.824633 },
    { name: '1925',             type: 'Residential building', screens: 1, lat: 18.959260, lng: 72.820931 },
    { name: 'Siddhesh Darshan', type: 'Residential building', screens: 1, lat: 18.958669, lng: 72.821456 },
    { name: 'Neo Clarissa',     type: 'Residential building', screens: 1, lat: 18.957593, lng: 72.823257 },
    { name: 'Earth Castle',     type: 'Residential building', screens: 1, lat: 18.956297, lng: 72.822145 },
    { name: 'Prasad Chambers',  type: 'Residential building', screens: 1, lat: 18.954396, lng: 72.817252 },
    { name: 'Darshan Heights',  type: 'Residential building', screens: 1, lat: 18.951529, lng: 72.824153 },
    { name: 'Bayvue',           type: 'Residential building', screens: 1, lat: 18.947042, lng: 72.826913 }
  ];

  /* Areas marked "coming soon". Add a screen in one of these and it
     promotes itself to live automatically, no need to edit this list. */
  var COMING_SOON = ['G/S', 'F/S'];   /* Worli, Parel */

  /* The seven areas drawn on the map, and what the tooltip calls them. */
  var WARDS = {
    'A'  : 'Colaba, Fort, Churchgate',
    'B'  : 'Chor Bazaar, Dongri, Masjid',
    'C'  : 'Kalbadevi, Bhuleshwar, Marine Lines',
    'D'  : 'Girgaon, Khetwadi, Tardeo',
    'E'  : 'Byculla, Mazgaon',
    'F/S': 'Parel, Sewri',
    'G/S': 'Worli, Lower Parel, Prabhadevi'
  };

  /* ===========================================================
     ============  NOTHING BELOW NEEDS EDITING  ================
     =========================================================== */

  var root    = document.getElementById('network-map');
  var svg     = document.getElementById('nmapSvg');
  var zoom    = document.getElementById('nmapZoom');
  var pinsG   = document.getElementById('nmapPins');
  var listEl  = document.getElementById('nmapList');
  var tip     = document.getElementById('nmapTip');
  var stage   = root.querySelector('.nmap__stage');
  var cluster = document.getElementById('nmapCluster');
  var SVGNS   = 'http://www.w3.org/2000/svg';

  /* Projection fitted to the ward paths above. Web Mercator.
     Do not change these three numbers or the pins will drift. */
  var MINX  = 72.79155678146928;
  var MAXY  = 19.386548397574700;
  var SCALE = 7157.657925466066;
  var VIEW_W = 560, VIEW_H = 1006, PAD = 26;
  var PIN_K = 1.5;   /* keeps pins and labels a constant on-screen size when zoomed */

  function project(lat, lng) {
    var my = Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2)) * 180 / Math.PI;
    return { x: (lng - MINX) * SCALE, y: (MAXY - my) * SCALE };
  }

  /* ---- 1. pins and list rows, built from LOCATIONS ---- */
  var PIN = 'M0,0 C-4.6,-6.2 -7.4,-9.4 -7.4,-13.4 A7.4,7.4 0 1 1 7.4,-13.4 C7.4,-9.4 4.6,-6.2 0,0 Z';
  var pins = [];

  LOCATIONS.forEach(function (loc, i) {
    var p = project(loc.lat, loc.lng);
    var n = loc.screens || 1;

    if (p.x < 0 || p.x > VIEW_W || p.y < 0 || p.y > VIEW_H) {
      console.warn('[network map] "' + loc.name + '" sits outside the South Mumbai map area. ' +
                   'Check its coordinates, or the map needs extending north.');
    }

    var g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'pin');
    g.setAttribute('transform', 'translate(' + p.x.toFixed(2) + ',' + p.y.toFixed(2) + ')');

    var inner = document.createElementNS(SVGNS, 'g');
    inner.setAttribute('class', 'pin-inner');

    var ring = document.createElementNS(SVGNS, 'circle');
    ring.setAttribute('class', 'pin-ring');
    ring.setAttribute('cy', '-13.4'); ring.setAttribute('r', '6');

    var art = document.createElementNS(SVGNS, 'g');
    art.setAttribute('class', 'pin-art');
    art.style.transitionDelay = (i * 55) + 'ms';

    var body = document.createElementNS(SVGNS, 'path');
    body.setAttribute('class', 'pin-body'); body.setAttribute('d', PIN);

    var dot = document.createElementNS(SVGNS, 'circle');
    dot.setAttribute('class', 'pin-dot');
    dot.setAttribute('cy', '-13.4'); dot.setAttribute('r', '2.6');

    art.appendChild(body); art.appendChild(dot);
    inner.appendChild(ring); inner.appendChild(art);
    g.appendChild(inner); pinsG.appendChild(g);

    var meta = loc.type + ' \u00B7 ' + n + ' screen' + (n > 1 ? 's' : '');
    var li = document.createElement('li');
    li.innerHTML =
      '<button type="button">' +
        '<span class="nmap__idx">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</span>' +
        '<span><span class="nmap__place"></span><span class="nmap__meta"></span></span>' +
      '</button>';
    li.querySelector('.nmap__place').textContent = loc.name;
    li.querySelector('.nmap__meta').textContent  = meta;
    var btn = li.querySelector('button');
    listEl.appendChild(li);

    pins.push({ g: g, inner: inner, btn: btn, loc: loc, pt: p });

    function on()  { toggle(i, true); }
    function off() { toggle(i, false); }
    g.addEventListener('mouseenter', function () { on(); showTip(g, loc.name, meta); });
    g.addEventListener('mouseleave', function () { off(); hideTip(); });
    btn.addEventListener('mouseenter', on);
    btn.addEventListener('mouseleave', off);
    btn.addEventListener('focus', on);
    btn.addEventListener('blur', off);
    btn.addEventListener('click', function () { setView('zoom'); });
  });

  function toggle(i, state) {
    pins[i].g.classList.toggle('is-on', state);
    pins[i].btn.classList.toggle('is-on', state);
  }

  /* ---- 2. work out which areas are live, from the pins themselves ---- */
  var liveWards = [];

  Array.prototype.forEach.call(root.querySelectorAll('.ward'), function (w) {
    var code = w.getAttribute('data-ward');
    var hit  = pins.some(function (p) { return inWard(w, p.pt); });
    var soon = !hit && COMING_SOON.indexOf(code) > -1;
    if (hit) liveWards.push(code);

    w.classList.toggle('live', hit);
    w.classList.toggle('soon', soon);

    var lbl = root.querySelector('.lblwrap[data-ward="' + code + '"]');
    if (lbl) { lbl.classList.toggle('live', hit); lbl.classList.toggle('soon', soon); }

    var status = hit ? 'Live now' : (soon ? 'Coming soon' : 'Expanding soon');
    w.addEventListener('mouseenter', function () { showTip(w, WARDS[code] || code, status); });
    w.addEventListener('mouseleave', hideTip);
    if (hit) w.addEventListener('click', function () { setView('zoom'); });
  });

  function inWard(pathEl, pt) {
    if (!pathEl.isPointInFill) {                  /* old browsers: bounding box fallback */
      var b = pathEl.getBBox();
      return pt.x >= b.x && pt.x <= b.x + b.width && pt.y >= b.y && pt.y <= b.y + b.height;
    }
    try {
      var p = svg.createSVGPoint ? svg.createSVGPoint() : new DOMPoint();
      p.x = pt.x; p.y = pt.y;
      return pathEl.isPointInFill(p);
    } catch (e) { return false; }
  }

  /* ---- 3. counts and copy, all derived ---- */
  var totalScreens = LOCATIONS.reduce(function (a, l) { return a + (l.screens || 1); }, 0);
  document.getElementById('nmapCount').textContent  = totalScreens;
  document.getElementById('nmapVenues').textContent = LOCATIONS.length;
  cluster.querySelector('.cluster-txt').textContent  = totalScreens;
  cluster.querySelector('.cluster-hint').textContent = 'screen' + (totalScreens > 1 ? 's' : '') + ' live';

  function firstNames(codes) {
    return codes.map(function (c) { return (WARDS[c] || c).split(',')[0].trim(); });
  }
  function join(a) {
    if (a.length < 2) return a[0] || '';
    return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  }
  var liveNames = firstNames(liveWards);
  var soonNames = firstNames(COMING_SOON.filter(function (c) { return liveWards.indexOf(c) === -1; }));

  document.getElementById('nmapSub').textContent =
    totalScreens + ' screen' + (totalScreens > 1 ? 's' : '') +
    ' live inside premium residential buildings' +
    (liveNames.length ? ' across ' + join(liveNames) : '') +
    (soonNames.length ? ', with ' + join(soonNames) + ' launching next' : '') +
    '. Hover a location to see where your brand shows up.';

  document.getElementById('nmapSoonLegend').textContent =
    soonNames.length ? 'Coming soon \u00B7 ' + soonNames.join(', ') : 'Coming soon';

  /* ---- 4. zoom between the overview and the screen cluster ---- */
  var target = null;

  function computeZoom() {
    if (!pins.length) return null;
    var xs = pins.map(function (p) { return p.pt.x; });
    var ys = pins.map(function (p) { return p.pt.y; });
    var cx = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
    var cy = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
    var hw = Math.max((Math.max.apply(null, xs) - Math.min.apply(null, xs)) / 2 * 1.45, 40);
    var hh = Math.max((Math.max.apply(null, ys) - Math.min.apply(null, ys)) / 2 * 1.45, 48);
    var s  = Math.max(Math.min((VIEW_W - PAD * 2) / (hw * 2), (VIEW_H - PAD * 2) / (hh * 2)), 1);
    return { s: s, tx: VIEW_W / 2 - cx * s, ty: VIEW_H / 2 - cy * s };
  }

  function setView(view) {
    if (root.getAttribute('data-view') === view) return;
    root.setAttribute('data-view', view);
    hideTip();

    Array.prototype.forEach.call(root.querySelectorAll('[data-view-btn]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-view-btn') === view));
    });

    var k = 1;
    if (view === 'zoom') {
      target = target || computeZoom();
      if (!target) return;
      zoom.setAttribute('transform',
        'translate(' + target.tx.toFixed(2) + ',' + target.ty.toFixed(2) + ') scale(' + target.s.toFixed(4) + ')');
      k = PIN_K / target.s;
    } else {
      zoom.setAttribute('transform', 'translate(0,0) scale(1)');
    }

    /* counter-scale so pins and labels keep a constant on-screen size */
    pins.forEach(function (p) { p.inner.setAttribute('transform', 'scale(' + k + ')'); });
    Array.prototype.forEach.call(root.querySelectorAll('.lblwrap text'), function (t) {
      t.setAttribute('transform', 'scale(' + k + ')');
    });
  }

  Array.prototype.forEach.call(root.querySelectorAll('[data-view-btn]'), function (b) {
    b.addEventListener('click', function () { setView(b.getAttribute('data-view-btn')); });
  });

  /* cluster badge sits at the centre of the swarm */
  (function () {
    if (!pins.length) { cluster.style.display = 'none'; return; }
    var cx = 0, cy = 0;
    pins.forEach(function (p) { cx += p.pt.x; cy += p.pt.y; });
    cluster.setAttribute('transform',
      'translate(' + (cx / pins.length).toFixed(1) + ',' + (cy / pins.length).toFixed(1) + ')');
    cluster.addEventListener('click', function () { setView('zoom'); });
  })();

  /* ---- 5. tooltip and scroll reveal ---- */
  function showTip(el, title, sub) {
    var b = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    tip.innerHTML = '<b></b><span></span>';
    tip.querySelector('b').textContent = title;
    tip.querySelector('span').textContent = sub;
    tip.style.left = (b.left - s.left + b.width / 2) + 'px';
    tip.style.top  = (b.top - s.top) + 'px';
    tip.classList.add('is-on');
  }
  function hideTip() { tip.classList.remove('is-on'); }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { root.classList.add('is-in'); io.disconnect(); }
      });
    }, { threshold: 0.2 });
    io.observe(svg);
  } else {
    root.classList.add('is-in');
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('is-reduced');
})();
</script>
</body>
</html>
